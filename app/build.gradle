plugins {
    id 'com.android.application'
}
android {
    namespace 'com.osmankale.nuvio.launcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.osmankale.nuvio.launcher"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.0.9-FINAL"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}
