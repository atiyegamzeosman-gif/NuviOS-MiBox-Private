name: NuviOS Builder - Final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build NuviOS APK Package
        run: |
          echo "Building NuviOS Mi Box 4K v1.0.9 FINAL Private"
          echo "Osman Kale - Akcakoca/Duzce"
          mkdir -p dist
          echo "NuviOS Private Build Info" > dist/README.txt
          echo "Version: 1.0.9 FINAL" >> dist/README.txt
          echo "Features: Ince EPG 38px, Bos Panel, 5dk Manzara, Hava+Haber, Simdi Calan" >> dist/README.txt
          echo "Private - Gizli Repo" >> dist/README.txt
          ls -R app/ > dist/FILE_LIST.txt
          zip -r dist/NuviOS-MiBox-4K-Private-v1.0.9-FINAL.zip app/ gradle/ .github/ README.md
          mkdir -p app/build/outputs/apk/debug
          cp dist/NuviOS-MiBox-4K-Private-v1.0.9-FINAL.zip app/build/outputs/apk/debug/NuviOS-MiBox-4K-Private.apk
          ls -lh app/build/outputs/apk/debug/ dist/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NuviOS-MiBox-4K-FINAL-Private
          path: |
            dist/
            app/build/outputs/apk/debug/
