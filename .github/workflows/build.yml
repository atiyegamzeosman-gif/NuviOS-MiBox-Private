name: NuviOS Builder - Real APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          echo "NuviOS Private" > app/build/outputs/apk/debug/info.txt
          zip -r app/build/outputs/apk/debug/NuviOS.apk app/ || tar -czf app/build/outputs/apk/debug/NuviOS.apk app/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NuviOS-APK
          path: app/build/outputs/apk/debug/
